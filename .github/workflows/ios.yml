name: ios

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "spec/**"
      - "docs/design.md"
      - ".github/workflows/ios.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let pushes to main queue so every commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # Pull requests always run this workflow so its required check ("ios") always
  # reports; this job decides whether the PR touches anything the check covers.
  # A skipped job counts as passing for branch protection.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(apps/ios/|spec/|docs/design\.md$|\.github/workflows/ios\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: ios
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Locally.xcodeproj -scheme Locally -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      # Pick an available iPhone simulator rather than naming one, so a runner
      # image that drops a device model does not break the build.
      - name: Test
        run: |
          SIM_ID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$SIM_ID" ] || [ "$SIM_ID" = "null" ]; then
            echo "::error::No available iPhone simulator on this runner"; exit 1
          fi
          xcodebuild test -project Locally.xcodeproj -scheme Locally \
            -destination "platform=iOS Simulator,id=$SIM_ID" CODE_SIGNING_ALLOWED=NO
