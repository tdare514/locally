name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "spec/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "spec/**"
      - ".github/workflows/api.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; let pushes to main queue so every commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Migrations run on the live database on first request, so the committed
      # drizzle/ folder must be exactly what the schema generates.
      - name: Migrations match schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            echo "::error::src/db/schema.ts changed without a committed migration; run npm run db:generate in apps/api and commit apps/api/drizzle"
            exit 1
          fi
