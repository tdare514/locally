# SAMPLER_SECRET is set with `wrangler secret put` and is never committed.
name = "locally-sampler-trigger"
main = "sampler-trigger.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *"]

[vars]
SAMPLER_URL = "https://locally-sync-api.vercel.app/v1/internal/spotify-sample"

[observability]
enabled = true
