name: Locally
options:
  bundleIdPrefix: com.tdare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # One version for the app and the share extension: App Store Connect
    # rejects an extension whose version differs from its containing app's.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Locally:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Locally
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tdare.locally
        SWIFT_VERSION: "5.10"
        # The listener mark, rendered by scripts/make-listener-icons.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # User-selectable alternate, rendered by scripts/make-listener-icons.py.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Line"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Locally/Info.plist
      properties:
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSPhotoLibraryUsageDescription: "Pick a cover image for your songs."
        # NSLocalNetworkUsageDescription and NSAppTransportSecurity are added
        # for Debug only, by the postBuildScripts step below.
        UILaunchScreen: {}
        CFBundleDisplayName: Locally
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      # Debug builds can point sync (spec/sync.md) at a dev server on the
      # Mac's LAN address — plain HTTP, not loopback — so they need an ATS
      # carve-out and the local-network permission prompt. Release always
      # uses the hosted API (SyncAccount.productionBaseURL) and ships
      # neither key. Runs before code signing; plutil -replace is idempotent.
      - name: Add Debug-only local-network keys
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            plutil -replace NSLocalNetworkUsageDescription -string "Locally uses your local network to sync with the sync server on your Mac during development." "$plist"
            plutil -replace NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}' "$plist"
          fi
    entitlements:
      path: Locally/Locally.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tdare.locally
    dependencies:
      - target: LocallyShare
        embed: true

  LocallyShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LocallyShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tdare.locally.share
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: LocallyShare/Info.plist
      properties:
        CFBundleDisplayName: Locally
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Activates for 1-20 shared items only when every one of them
            # conforms to public.audio (the SUBQUERY form, since the simple
            # NSExtensionActivationSupportsFileWithMaxCount dictionary key
            # has no way to filter by UTI).
            NSExtensionActivationRule: |-
              SUBQUERY (
                  extensionItems,
                  $extensionItem,
                  SUBQUERY (
                      $extensionItem.attachments,
                      $attachment,
                      ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio"
                  ).@count == $extensionItem.attachments.@count
              ).@count == extensionItems.@count AND extensionItems.@count >= 1 AND extensionItems.@count <= 20
    entitlements:
      path: LocallyShare/LocallyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tdare.locally

  LocallyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LocallyTests
    dependencies:
      - target: Locally
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.tdare.locally.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Locally.app/Locally"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Locally:
    build:
      targets:
        Locally: all
        LocallyShare: all
        LocallyTests: [test]
    test:
      targets:
        - LocallyTests
    run:
      config: Debug
      storeKitConfiguration: Locally.storekit
