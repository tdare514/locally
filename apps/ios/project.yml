name: Locally
options:
  bundleIdPrefix: com.tdare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Locally:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Locally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tdare.locally
        SWIFT_VERSION: "5.10"
        # No AppIcon set yet (added before App Store submission in phase 3);
        # explicitly cleared because XcodeGen otherwise defaults this to
        # "AppIcon", which fails asset-catalog compilation when no such
        # icon set exists.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Locally/Info.plist
      properties:
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSPhotoLibraryUsageDescription: "Pick a cover image for your songs."
        UILaunchScreen: {}

  LocallyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LocallyTests
    dependencies:
      - target: Locally
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.tdare.locally.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Locally.app/Locally"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Locally:
    build:
      targets:
        Locally: all
        LocallyTests: [test]
    test:
      targets:
        - LocallyTests
    run:
      config: Debug
